name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack source
        run: |
          mkdir -p src
          unzip -q code/syntonmancy-2.1.6-source.zip -d src
          test -f src/syntonmancy-2.1.6/desktop/main.js

      - name: Patch Electron main process for macOS
        working-directory: src/syntonmancy-2.1.6/desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('main.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            "const trayImagePath = fs.existsSync(iconIcoPath) ? iconIcoPath : trayPath;",
            "const trayImagePath = process.platform === 'win32' && fs.existsSync(iconIcoPath) ? iconIcoPath : (fs.existsSync(trayPath) ? trayPath : iconPath);",
          )
          s = s.replace(
            "icon: fs.existsSync(iconIcoPath) ? iconIcoPath : (fs.existsSync(iconPath) ? iconPath : undefined),",
            "icon: process.platform === 'win32' && fs.existsSync(iconIcoPath) ? iconIcoPath : (fs.existsSync(iconPath) ? iconPath : undefined),",
          )
          p.write_text(s, encoding='utf-8')
          print('patched main.js')
          PY

      - name: Install build dependencies
        working-directory: src/syntonmancy-2.1.6/desktop
        run: npm ci

      - name: Generate macOS icon
        working-directory: src/syntonmancy-2.1.6/desktop
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" assets/icon-v3.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s*2))" "$((s*2))" assets/icon-v3.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o assets/icon-v3.icns

      - name: Package .app
        working-directory: src/syntonmancy-2.1.6/desktop
        run: |
          npx electron-packager . "字势静兼" \
            --platform=darwin \
            --arch=${{ matrix.arch }} \
            --out=dist-mac \
            --overwrite \
            --no-asar \
            --app-bundle-id=com.syntonmancy.desktop \
            --app-version=2.1.6 \
            --build-version=2.1.6 \
            --icon=assets/icon-v3.icns \
            --ignore="^/(dist|dist-mac|node_modules|tools|Syntonmancy-Setup.*|Syntonmancy-Windows.*|字间-Windows.*|字势静兼-Windows.*)"

      - name: Add notices, ad-hoc sign, and zip
        working-directory: src/syntonmancy-2.1.6/desktop
        run: |
          APP="dist-mac/字势静兼-darwin-${{ matrix.arch }}/字势静兼.app"
          test -d "$APP"
          cp "$GITHUB_WORKSPACE/LICENSE" "$APP/Contents/Resources/LICENSE"
          cp "$GITHUB_WORKSPACE/LICENSE-APACHE-2.0" "$APP/Contents/Resources/LICENSE-APACHE-2.0"

          # Ad-hoc signature: no Apple Developer certificate is required.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          mkdir -p package-${{ matrix.arch }}
          cp -R "$APP" "package-${{ matrix.arch }}/"
          cat > "package-${{ matrix.arch }}/README-MAC.txt" <<'EOF'
字势静兼 / Syntonmancy 2.1.6 — macOS

This app is unsigned by an Apple Developer ID and is only ad-hoc signed.
It is not notarized. On first launch, macOS may block it.

How to open:
1. Unzip this package.
2. Drag 字势静兼.app to Applications if you want.
3. Right-click the app, choose Open, then confirm Open.
4. If macOS says it is damaged or cannot be opened, run:

   xattr -dr com.apple.quarantine "/Applications/字势静兼.app"

   Then try opening again.

Data is stored locally at:
   ~/Library/Application Support/字势静兼

Backups are stored inside the app's local data directory. Export a JSON
backup before uninstalling or clearing the app data.

License:
   Code: GPL-3.0-only
   Paper/docs: see the LICENSE files inside the app bundle.
EOF

          ditto -c -k --sequesterRsrc --keepParent \
            "package-${{ matrix.arch }}" \
            "Syntonmancy-2.1.6-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Syntonmancy-macOS-${{ matrix.arch }}
          path: src/syntonmancy-2.1.6/desktop/Syntonmancy-2.1.6-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
